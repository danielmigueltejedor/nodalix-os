<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root"><allow own="com.nodalix.Keyboard"/></policy>
  <policy context="default">
    <allow send_destination="com.nodalix.Keyboard" send_interface="com.nodalix.Keyboard" send_member="Edit"/>
  </policy>
</busconfig>
