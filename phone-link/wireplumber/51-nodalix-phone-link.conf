monitor.bluez.properties = {
  # Keep normal Bluetooth audio working for headphones/speakers while
  # enabling the Hands-Free role used by iPhone calls through oFono.
  # This property is global to the BlueZ monitor, so restricting it to HFP
  # would remove A2DP support from every Bluetooth audio device.
  "bluez5.roles" = [ "hsp_hs", "hsp_ag", "hfp_hf", "hfp_ag", "a2dp_sink", "a2dp_source" ]
  "bluez5.codecs" = [ "sbc", "sbc_xq" ]
  "bluez5.enable-msbc" = true
  "bluez5.enable-hw-volume" = true
  "bluez5.hfphsp-backend" = "ofono"
}
