monitor.bluez.properties = {
  # Desktop sends media to Bluetooth headphones/speakers (A2DP Source), but
  # must not act as an A2DP Sink for phones.  The iPhone therefore uses the PC
  # only for HFP calls instead of routing all music/video through the desktop.
  "bluez5.roles" = [ "hsp_hs", "hsp_ag", "hfp_hf", "hfp_ag", "a2dp_source" ]
  "bluez5.codecs" = [ "sbc", "sbc_xq" ]
  "bluez5.enable-msbc" = true
  "bluez5.enable-hw-volume" = true
  "bluez5.hfphsp-backend" = "ofono"
}
