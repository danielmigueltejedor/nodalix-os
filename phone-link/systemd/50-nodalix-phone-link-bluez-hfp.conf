# Nodalix Phone Link enables BlueZ experimental D-Bus APIs for iPhone
# integration. BlueZ 5.87 also ships an experimental built-in HFP Hands-Free
# client named "hfp"; when loaded, it races oFono for the iPhone's HFP AG
# profile and prevents oFono from receiving Profile1.NewConnection.
#
# Keep BlueZ experimental APIs enabled, but leave HFP call control and SCO to
# oFono + PipeWire's oFono backend.
[Service]
ExecStart=
ExecStart=/usr/lib/bluetooth/bluetoothd --noplugin=hfp
