# One workspace for every native Nodalix app, so they share one lock file, one NDL revision and
# one build of GTK's Rust bindings.
[workspace]
resolver = "2"
members = ["crates/*", "monitor/crates/*", "ajustes/crates/*", "archivador/crates/*"]

[workspace.package]
version = "0.6.1"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Fixed to an exact commit. When NDL changes, bump it here, for every app at once.
nodalia-gtk = { git = "https://github.com/danielmigueltejedor/nodalia-design", rev = "6bc095f2e37a11076f6b122917b71fddf4984f83" }
archivador-core = { path = "archivador/crates/archivador-core" }
monitor-core = { path = "monitor/crates/monitor-core" }
nodalix-ui = { path = "crates/nodalix-ui" }
