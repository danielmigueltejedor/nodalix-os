[package]
name = "nodalix-settings"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
adw = { package = "libadwaita", version = "0.7", features = ["v1_2"] }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
nodalix-profile = { path = "../../crates/nodalix-profile" }
nodalix-system-actions = { path = "../../crates/nodalix-system-actions" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

