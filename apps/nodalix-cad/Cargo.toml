[package]
name = "nodalix-cad"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
adw = { package = "libadwaita", version = "0.7" }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cairo-rs = { version = "0.20", features = ["pdf"] }
