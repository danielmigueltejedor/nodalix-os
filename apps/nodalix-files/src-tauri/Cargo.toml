[package]
name = "nodalix-files"
version = "0.2.0"
description = "Nodalix Files — modern file browser for Linux/Wayland"
authors = ["Nodalix"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 16
lto = "thin"
strip = true
opt-level = "z"
