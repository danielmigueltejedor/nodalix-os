<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias binding="strong">
    <family>Nodalix Emoji</family>
    <prefer>
      <family>Fluent Emoji Color</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>emoji</family>
    <prefer>
      <family>Fluent Emoji Color</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
