# Applied only when zram-generator actually sets up a zram swap device.
#
# The pinned kernel enables zswap by default. With zram swap behind it, every
# page is compressed twice (zstd in the zswap pool, then lz4 when it is written
# back to zram) and the zswap LRU competes with zram's. Turn zswap off while zram
# swap is in use. Swap readahead (vm.page-cluster, default 3 = 8 pages) only
# wastes CPU and memory on a compressed RAM device, so read one page at a time.
#
# An administrator can override or mask this drop-in in /etc/systemd/system.
[Service]
ExecStartPost=-/usr/bin/sh -c 'echo N > /sys/module/zswap/parameters/enabled'
ExecStartPost=-/usr/bin/sysctl -q vm.page-cluster=0
