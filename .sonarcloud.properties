# SonarCloud automatic analysis settings.
#
# gnome/control-center/ndl/ holds the NDL GTK style sheets. They use GTK-only
# CSS (@define-color, the "row" and "spinbutton" nodes, var() in GTK 4.16+),
# which the generic CSS analyser reports as unknown.
sonar.exclusions=gnome/control-center/ndl/**,gnome/archivador/*.css
