# SonarCloud automatic analysis settings.
#
# gnome/control-center/ndl/ holds the NDL GTK style sheets, and the native apps under apps/ have
# GTK style sheets of their own. They use GTK-only CSS (@define-color, the "row", "headerbar",
# "columnview" and "spinbutton" nodes, ":selected", var() in GTK 4.16+), which the generic CSS
# analyser reports as unknown.
sonar.exclusions=gnome/control-center/ndl/**,apps/**/*.css
