# SonarCloud automatic analysis settings.
#
# gnome/control-center/ndl/ holds the NDL GTK style sheets, gnome/archivador/ has Archivador's
# overrides on them, and the native apps under apps/ have GTK style sheets of their own. They use
# GTK-only CSS (@define-color, the "row", "headerbar", "columnview" and "spinbutton" nodes,
# ":selected", var() in GTK 4.16+), which the generic CSS analyser reports as unknown.
#
# GNOME Shell extensions style St actors (StLabel, .popup-menu-item, -st-* properties), which
# the generic CSS analyser reports the same way. The extensions under gnome/extensions/ that are
# not named nodalix-* are vendored from upstream (see gnome/extensions/UPSTREAM.md) and are
# reviewed there, not here.
sonar.exclusions=gnome/control-center/ndl/**,gnome/archivador/*.css,apps/**/*.css,gnome/extensions/**/*.css,gnome/extensions/blur-my-shell@aunetx/**,gnome/extensions/dash-to-dock@micxgx.gmail.com/**,gnome/extensions/global-menu@unmade.space/**,gnome/extensions/glocalsend@donnybeelo.github.com/**,gnome/extensions/multi-monitors-bar@frederykabryan/**,gnome/extensions/rounded-window-corners@ztrahmet.github.io/**,gnome/extensions/tiling-assistant@leleat-on-github/**,gnome/lib/global-menu/globalmenu/treelib/**
