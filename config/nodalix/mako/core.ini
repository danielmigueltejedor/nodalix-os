# Nodalix Mako notifications
# Config directa compatible con tu versión de Mako

font=JetBrainsMono Nerd Font 11
width=420
height=160
margin=12,20,0,0
padding=14
border-size=2
border-radius=22
icons=1
max-icon-size=42
default-timeout=6500
ignore-timeout=0
anchor=top-right
layer=overlay
sort=-time

background-color=#11111bf2
text-color=#cdd6f4
border-color=#cba6f7ee
progress-color=over #cba6f755

# Modo no molestar
[mode=do-not-disturb]
invisible=1

# Urgencia baja
[urgency=low]
background-color=#11111be8
text-color=#a6adc8
border-color=#6c7086aa
default-timeout=4200

# Urgencia normal
[urgency=normal]
background-color=#11111bf2
text-color=#cdd6f4
border-color=#cba6f7ee
default-timeout=6500

# Urgencia crítica
[urgency=critical]
background-color=#1e1118f8
text-color=#ffffff
border-color=#f38ba8ff
default-timeout=0

# Nodalix / sistema
[app-name=Nodalix]
border-color=#cba6f7ff
background-color=#181525f8

[app-name="Nodalix Accent"]
border-color=#cba6f7ff
background-color=#181525f8

[app-name="Nodalix Network"]
border-color=#89b4faff
background-color=#111827f8

[app-name="Nodalix Bluetooth"]
border-color=#89b4faff
background-color=#111827f8

[app-name="Nodalix Audio"]
border-color=#a6e3a1ff
background-color=#101c18f8

[app-name="Nodalix Files"]
border-color=#cba6f7ff
background-color=#181525f8

[app-name="Nodalix Privacy"]
border-color=#f5c2e7ff
background-color=#211421f8

# Acciones rápidas heredadas
[summary="Setup Wi-Fi"]
on-button-left=exec sh -c 'makoctl dismiss "Setup Wi-Fi"; nm-connection-editor'

[summary="Update System"]
on-button-left=exec sh -c 'makoctl dismiss "Update System"; ghostty -e bash -lc "yay -Syu; read -p \"Pulsa Enter para cerrar...\""'

[summary="Learn Keybindings"]
on-button-left=exec sh -c 'makoctl dismiss "Learn Keybindings"; notify-send "Nodalix" "Keybindings menu pendiente de migrar"'

[summary="Install Dictation with Voxtype"]
on-button-left=exec sh -c 'makoctl dismiss "Install Dictation with Voxtype"; notify-send "Nodalix" "Dictation installer pendiente de migrar"'
