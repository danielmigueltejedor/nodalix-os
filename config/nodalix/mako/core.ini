anchor=top-right
group-by=app-name,summary,body
default-timeout=5000
width=420
outer-margin=20
padding=10,15
border-size=2
max-icon-size=32
font=sans-serif 14px

[app-name=Spotify]
invisible=1

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false

[urgency=critical]
default-timeout=0
layer=overlay

[summary~="Setup Wi-Fi"]
on-button-left=exec sh -c 'makoctl dismiss "Setup Wi-Fi"; nm-connection-editor'

[summary~="Update System"]
on-button-left=exec sh -c 'makoctl dismiss "Update System"; ghostty -e bash -lc 'yay -Syu; read -p "Pulsa Enter para cerrar..."''

[summary~="Learn Keybindings"]
on-button-left=exec sh -c 'makoctl dismiss "Learn Keybindings"; notify-send 'Nodalix' 'Keybindings menu pendiente de migrar''

[summary~="Install Dictation with Voxtype"]
on-button-left=exec sh -c 'makoctl dismiss "Install Dictation with Voxtype"; notify-send 'Nodalix' 'Dictation installer pendiente de migrar''

[summary~="Screenshot copied & saved"]
max-icon-size=80
format=<b>%s</b>\n%b
