# Nodalix idle / lock policy
#
# - hypridle starts ONCE from default/hypr/autostart.lua (exec-once).
# - Do NOT enable nodalix-idle.service (swayidle) — it duplicates these timers.
# - Never call hyprlock directly from listeners; use loginctl lock-session or nodalix-lock.
# - lock_cmd is the only place that execs hyprlock (via nodalix-lock).

general {
    lock_cmd = pgrep -x hyprlock >/dev/null || nodalix-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = nodalix-system-wake
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Session lock after 5 minutes idle (logind → hypridle lock_cmd → nodalix-lock).
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Display power only — no second lock here.
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
