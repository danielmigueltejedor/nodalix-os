# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Review configuration for public open-source pull requests.
# Requires installation of the CodeRabbit GitHub App; this file alone does not activate reviews.
language: "en-US"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
  path_filters:
    - "!**/node_modules/**"
    - "!**/.venv/**"
    - "!**/vendor/**"
    - "!**/build/**"
    - "!**/dist/**"
  path_instructions:
    - path: "gnome/**"
      instructions: |
        Prioritize GNOME Shell/Mutter compatibility, resource cleanup, settings
        migrations, extension lifecycle, and session stability. Avoid suggesting
        workarounds that silently replace Nodalix-owned integrations.
    - path: "tools/**"
      instructions: |
        Check command injection, correct quoting, atomic system updates, permissions,
        error handling, rollback paths, idempotency, and Arch Linux compatibility.
    - path: ".github/workflows/**"
      instructions: |
        Check GitHub Actions permission scope, untrusted PR input, dependency pinning,
        release provenance, and fork-safe execution.
