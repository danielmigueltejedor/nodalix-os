name: nxpm

on:
  push:
    paths:
      - "nxpm/**"
      - "docs/nxpm.md"
      - ".github/workflows/nxpm.yml"
  pull_request:
    paths:
      - "nxpm/**"
      - "docs/nxpm.md"
      - ".github/workflows/nxpm.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nxpm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: 'python -m pip install --only-binary :all: --require-hashes -r requirements-test.txt'
      - run: python -m pytest
