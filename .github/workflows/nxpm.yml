name: nxpm

on:
  push:
    paths:
      - "nxpm/**"
      - "docs/nxpm.md"
      - ".github/workflows/nxpm.yml"
  pull_request:
    paths:
      - "nxpm/**"
      - "docs/nxpm.md"
      - ".github/workflows/nxpm.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nxpm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: 'python -m pip install --only-binary :all: --require-hashes -r requirements-test.txt'
      - run: python -m pytest
