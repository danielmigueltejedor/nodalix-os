name: Release Nodalix OS

on:
  push:
    tags:
      - "[0-9]*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Nodalix release tag to rebuild
        required: true
        type: string

      publish:
        description: Publish/update the GitHub Release after validation
        required: true
        type: boolean
        default: false

      skip_upgrade_test:
        description: Reuse a previously successful upgrade validation for this release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      stable: ${{ steps.metadata.outputs.stable }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release metadata
        id: metadata
        env:
          RAW_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import sys

          sys.path.insert(0, "tools")

          from versioning import (
              canonical_version,
              is_prerelease_tag,
          )

          tag = canonical_version(
              os.environ["RAW_RELEASE_TAG"]
          )

          version = canonical_version(
              pathlib.Path("VERSION").read_text()
          )

          if tag != version:
              raise SystemExit(
                  f"tag {tag} does not match VERSION {version}"
              )

          stable = not is_prerelease_tag(tag)

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"release_tag={tag}\n"
              )
              output.write(
                  f"stable={'true' if stable else 'false'}\n"
              )

          print(
              tag,
              "stable" if stable else "prerelease",
          )
          PY

      - name: Require curated release notes
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: |
          python3 tools/release_notes.py validate --version "$RELEASE_TAG"

      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi gnome-shell-common gir1.2-nautilus-4.0 gir1.2-gtk-4.0 gir1.2-adw-1 nodejs libarchive-tools gjs xvfb dbus-x11 libadwaita-1-dev libjson-glib-dev

      - name: Run updater tests
        run: |
          /usr/bin/python3 -m unittest discover -s tests -v

      - name: Compile release tooling
        run: |
          python -m py_compile \
            tools/build-iso.py \
            tools/finalize-release.py \
            iso/installer/nodalix_profile.py \
            iso/installer/nodalix-install

  build:
    needs:
      - test

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.release_tag }}
          fetch-depth: 0

      - name: Build Arch packages
        env:
          RELEASE_TAG: ${{ needs.test.outputs.release_tag }}
        run: |
          rm -rf dist/packages
          mkdir -p dist

          docker run --rm \
            -e NODALIX_CI_CONTAINER=1 \
            -e NODALIX_RELEASE_TAG="$RELEASE_TAG" \
            -v "$PWD":/src -w /src archlinux:latest \
            bash tools/ci-build-gnome.sh

      - name: Validate tag and manifest
        env:
          NODALIX_RELEASE_TAG: ${{ needs.test.outputs.release_tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          sys.path.insert(0, "tools")

          from versioning import canonical_version

          tag = canonical_version(
              os.environ["NODALIX_RELEASE_TAG"]
          )

          manifest = json.loads(
              pathlib.Path(
                  "dist/packages/nodalix-manifest.json"
              ).read_text()
          )

          if manifest["version"] != tag:
              raise SystemExit(
                  f"manifest {manifest['version']} "
                  f"does not match tag {tag}"
              )

          print("validated", tag)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nodalix-packages
          path: dist/packages/*
          if-no-files-found: error

  upgrade-test:
    needs:
      - test
      - build

    if: >-
      !(
        github.event_name == 'workflow_dispatch' &&
        inputs.skip_upgrade_test == true
      )

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.release_tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: nodalix-packages
          path: dist/packages

      - name: Validate 0.2.4 to GNOME through the updater bridge
        run: docker run --rm -e NODALIX_CI_CONTAINER=1 -v "$PWD":/src -w /src archlinux:latest bash -c "bash tools/ci-migrate-024.sh && bash tools/ci-boot-migrated.sh"

      - name: Resolve previous stable releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.test.outputs.release_tag }}
        run: |
          set -euo pipefail

          mkdir -p dist/upgrade-baselines

          mapfile -t BASELINES < <(
            gh api \
              --paginate \
              "repos/$GITHUB_REPOSITORY/releases" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | sed 's/^v//' \
            | grep -vx "$RELEASE_TAG" \
            | sort -V \
            | tail -n 2
          )

          if (( ${#BASELINES[@]} == 0 )); then
            echo "::error::No previous stable release found"
            exit 1
          fi

          printf 'Testing baselines:'
          printf ' %s' "${BASELINES[@]}"
          printf '\n'

          for version in "${BASELINES[@]}"; do
            mkdir -p "dist/upgrade-baselines/$version"

            gh release download \
              "$version" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern '*.pkg.tar.zst' \
              --dir "dist/upgrade-baselines/$version"
          done

          printf '%s\n' "${BASELINES[@]}" \
            > dist/upgrade-baselines/versions.txt

      - name: Test clean candidate package set
        env:
          RELEASE_TAG: ${{ needs.test.outputs.release_tag }}
        run: |
          set -euo pipefail

          mkdir -p dist/upgrade-baselines/clean

          docker run --rm \
            -v "$PWD":/src \
            -w /src \
            archlinux:latest \
            bash -lc "
              pacman -Syu --noconfirm &&
              /src/tools/test-package-upgrade.sh \
                /src/dist/upgrade-baselines/clean \
                /src/dist/packages \
                '$RELEASE_TAG' \
                clean
            "

      - name: Test upgrades from previous stable releases
        env:
          RELEASE_TAG: ${{ needs.test.outputs.release_tag }}
        run: |
          set -euo pipefail

          mapfile -t BASELINES \
            < dist/upgrade-baselines/versions.txt

          for version in "${BASELINES[@]}"; do
            scenario=normal

            if ! compgen -G \
              "dist/upgrade-baselines/$version/nodalix-cursor-theme-*.pkg.tar.zst" \
              >/dev/null
            then
              scenario=legacy-cursor
            fi

            echo
            echo "========================================"
            echo "Testing $version -> $RELEASE_TAG"
            echo "Scenario: $scenario"
            echo "========================================"

            docker run --rm \
              -v "$PWD":/src \
              -w /src \
              archlinux:latest \
              bash -lc "
                pacman -Syu --noconfirm &&
                /src/tools/test-package-upgrade.sh \
                  '/src/dist/upgrade-baselines/$version' \
                  /src/dist/packages \
                  '$RELEASE_TAG' \
                  '$scenario'
              "
          done

  iso:
    needs:
      - test
      - build
      - upgrade-test

    if: >-
      always() &&
      needs.test.outputs.stable == 'true' &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      (
        needs.upgrade-test.result == 'success' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.skip_upgrade_test == true &&
          needs.upgrade-test.result == 'skipped'
        )
      )

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.release_tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: nodalix-packages
          path: dist/packages

      - name: Build Nodalix ISO
        run: |
          set -euo pipefail

          max_attempts=3

          for attempt in $(seq 1 "$max_attempts"); do
            echo
            echo "========================================"
            echo "ISO build attempt $attempt/$max_attempts"
            echo "========================================"

            sudo rm -rf \
              dist/iso-work \
              dist/iso

            mkdir -p dist/iso

            if docker run \
              --rm \
              --privileged \
              -v "$PWD":/src \
              -w /src \
              archlinux:latest \
              bash -lc '
                set -euo pipefail

                pacman -Syu --noconfirm

                pacman -S --noconfirm \
                  archiso \
                  python

                python3 \
                  /src/tools/build-iso.py \
                  --assets /src/dist/packages \
                  --work /src/dist/iso-work \
                  --output /src/dist/iso
              '
            then
              echo "ISO build succeeded on attempt $attempt"
              break
            fi

            if (( attempt == max_attempts )); then
              echo "::error::ISO build failed after $max_attempts attempts"
              exit 1
            fi

            delay=$((attempt * 30))
            echo "::warning::ISO build failed; retrying in ${delay}s"
            sleep "$delay"
          done

      - name: Validate ISO
        env:
          RELEASE_TAG: ${{ needs.test.outputs.release_tag }}
        run: |
          set -euo pipefail

          ISO="dist/iso/nodalix-${RELEASE_TAG}-x86_64.iso"
          CHECKSUM="${ISO}.sha256"

          test -s "$ISO"
          test -s "$CHECKSUM"

          ISO_SIZE="$(stat -c%s "$ISO")"
          MAX_GITHUB_RELEASE_ASSET_BYTES=2147483647

          echo "ISO size: $ISO_SIZE bytes"

          if (( ISO_SIZE > MAX_GITHUB_RELEASE_ASSET_BYTES )); then
            echo "::error::ISO exceeds GitHub Releases 2 GiB asset limit: $ISO_SIZE bytes"
            exit 1
          fi

          cd dist/iso

          sha256sum -c \
            "$(basename "$CHECKSUM")"

          echo "ISO validated:"
          ls -lh \
            "$(basename "$ISO")" \
            "$(basename "$CHECKSUM")"

      - uses: actions/upload-artifact@v4
        with:
          name: nodalix-iso
          path: |
            dist/iso/*.iso
            dist/iso/*.iso.sha256
          if-no-files-found: error

  publish:
    needs:
      - test
      - build
      - upgrade-test
      - iso

    if: >-
      always() &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      (
        needs.upgrade-test.result == 'success' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.skip_upgrade_test == true &&
          needs.upgrade-test.result == 'skipped'
        )
      ) &&
      (
        needs.test.outputs.stable != 'true' ||
        needs.iso.result == 'success'
      ) &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.publish == true
      )

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.release_tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: nodalix-packages
          path: dist/release

      - uses: actions/download-artifact@v4
        if: needs.test.outputs.stable == 'true'
        with:
          name: nodalix-iso
          path: dist/release

      - name: Build release changelog
        env:
          RELEASE_TAG: ${{ needs.test.outputs.release_tag }}
        run: |
          python3 tools/release_notes.py build --tag "$RELEASE_TAG" --output dist/release-notes.md

      - name: Include the 0.2.4 migration bridge
        run: cp updater/nodalix-migrate-gnome dist/release/nodalix-migrate-gnome

      - name: Finalize manifest and checksums
        run: |
          python3 \
            tools/finalize-release.py \
            --assets-dir dist/release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.test.outputs.release_tag }}
          STABLE: ${{ needs.test.outputs.stable }}
        run: |
          set -euo pipefail

          NOTES_FILE="dist/release-notes.md"

          if ! gh release view \
              "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              >/dev/null 2>&1
          then
            if [[ -f "$NOTES_FILE" ]]
            then
              gh release create \
                "$RELEASE_TAG" \
                --verify-tag \
                --draft \
                --title "Nodalix OS $RELEASE_TAG" \
                --notes-file "$NOTES_FILE" \
                --repo "$GITHUB_REPOSITORY"
            else
              gh release create \
                "$RELEASE_TAG" \
                --verify-tag \
                --draft \
                --title "Nodalix OS $RELEASE_TAG" \
                --notes "Nodalix OS $RELEASE_TAG." \
                --repo "$GITHUB_REPOSITORY"
            fi
          fi

          if [[ -f "$NOTES_FILE" ]]
          then
            gh release edit \
              "$RELEASE_TAG" \
              --notes-file "$NOTES_FILE" \
              --repo "$GITHUB_REPOSITORY"
          fi

          if [[ "$STABLE" == "true" ]]
          then
            gh release edit \
              "$RELEASE_TAG" \
              --prerelease=false \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release edit \
              "$RELEASE_TAG" \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          fi

          gh release upload \
            "$RELEASE_TAG" \
            dist/release/* \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

          # A new release stays invisible to the updater until every
          # asset has been uploaded successfully.
          gh release edit \
            "$RELEASE_TAG" \
            --draft=false \
            --repo "$GITHUB_REPOSITORY"

          gh release view \
            "$RELEASE_TAG" \
            --json \
            tagName,name,isDraft,isPrerelease,assets,url \
            --repo "$GITHUB_REPOSITORY"
