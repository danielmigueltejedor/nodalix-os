name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require curated release notes
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          python3 tools/release_notes.py validate \
            --version "$VERSION"

      - name: Run updater and release tests
        run: python -m unittest discover -s tests -v
